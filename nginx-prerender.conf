# /etc/nginx/sites-available/bhaktiananda (or default)
# Nginx Configuration with Prerender.io Token: 2lshcvOJnuE2xAxcEKrH

server {
    listen 80;
    listen 443 ssl http2;
    server_name www.bhaktianandaodiatvofficial.blog bhaktianandaodiatvofficial.blog;

    root /var/www/html/dist;
    index index.html;

    # Your Prerender.io Account Token
    set $prerender_token "2lshcvOJnuE2xAxcEKrH";

    location / {
        try_files $uri @prerender;
    }

    location @prerender {
        set $prerender 0;

        # 1. Detect Social Media Bots and Search Engine Crawlers
        if ($http_user_agent ~* "facebookexternalhit|facebot|twitterbot|whatsapp|linkedinbot|pinterest|slackbot|telegrambot|discordbot|applebot|googlebot|bingbot|yandex|baiduspider|redditbot") {
            set $prerender 1;
        }
        if ($args ~ "_escaped_fragment_") {
            set $prerender 1;
        }

        # 2. Never proxy POST, PUT, DELETE requests
        if ($request_method = 'POST') {
            set $prerender 0;
        }

        # 3. Do not proxy static asset requests
        if ($uri ~* "\.(js|css|xml|less|png|jpg|jpeg|gif|pdf|doc|txt|ico|rss|zip|mp3|rar|exe|wmv|doc|avi|ppt|mpg|mpeg|tif|wav|mov|psd|ai|xls|mp4|m4a|swf|dat|dmg|iso|flv|m4v|torrent|ttf|woff|woff2|svg|eot)") {
            set $prerender 0;
        }

        # 4. Proxy matched crawler requests to Prerender.io with your token
        if ($prerender = 1) {
            resolver 8.8.8.8 1.1.1.1 valid=300s;
            rewrite .* /$scheme://$host$request_uri? break;
            
            proxy_set_header X-Prerender-Token $prerender_token;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Set-Cookie;
            
            proxy_pass https://service.prerender.io;
            break;
        }

        # 5. Normal human visitors get the standard React SPA index.html
        if ($prerender = 0) {
            rewrite .* /index.html break;
        }
    }
}
