    <script>
      (function() {
        try {
          var globalThumb = (localStorage.getItem('globalThumbnail') || localStorage.getItem('main_app_thumbnail_url') || '').trim();
          var elImg = document.getElementById('og-img');
          if (globalThumb && elImg) {
            elImg.setAttribute('content', globalThumb);
          }

          var params = new URLSearchParams(window.location.search);
          var templeId = params.get('temple') || params.get('templeId');
          if (!templeId) return;

          var raw = localStorage.getItem('temple_system_temples_json') || localStorage.getItem('savedTemples');
          if (raw) {
            var temples = JSON.parse(raw);
            if (Array.isArray(temples)) {
              var match = temples.find(function(t) { return t.id === templeId; });
              if (match) {
                var title = match.name + ' - ପୂଜା ଓ ଜଳାଭିଷେକ ବୁକିଂ';
                var desc = '🚩 ' + match.name + ' ରେ ଜଳାଭିଷେକ ଏବଂ ସ୍ୱତନ୍ତ୍ର ପୂଜା ବୁକିଂ କରନ୍ତୁ।';
                var img = match.thumbnailUrl || match.imageUrl || match.image || '';

                document.title = title;

                var elTitle = document.getElementById('og-title');
                if (elTitle) elTitle.setAttribute('content', title);

                var elDesc = document.getElementById('og-desc');
                if (elDesc) elDesc.setAttribute('content', desc);

                if (img && elImg) {
                  elImg.setAttribute('content', img);
                }
              }
            }
          }
        } catch(e) {}
      })();
    </script>
