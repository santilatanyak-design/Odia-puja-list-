        if (!Array.prototype.includes) {
          Array.prototype.includes = function(searchElement, fromIndex) {
            if (this == null) throw new TypeError('"this" is null or not defined');
            var o = Object(this);
            var len = o.length >>> 0;
            if (len === 0) return false;
            var n = fromIndex | 0;
            var k = Math.max(n >= 0 ? n : len - Math.abs(n), 0);
            while (k < len) {
              if (o[k] === searchElement || (typeof o[k] === 'number' && typeof searchElement === 'number' && isNaN(o[k]) && isNaN(searchElement))) {
                return true;
              }
              k++;
            }
            return false;
          };
        }

        // Object.assign polyfill
        if (typeof Object.assign !== 'function') {
          Object.assign = function(target) {
            if (target === null || target === undefined) {
              throw new TypeError('Cannot convert undefined or null to object');

    <!-- 3-Second Auto-Reload Failsafe against White Screens / Cached Script Crashes -->

      (function() {

        var startupErrorOccurred = false;
        window.addEventListener('error', function(e) {

            var isBlank = !rootEl || rootEl.children.length === 0;

            if ((isBlank || startupErrorOccurred) && !hasReloaded) {

        }, 3000);
      })();

    <script>
      (function() {
        try {
          var globalThumb = (localStorage.getItem('globalThumbnail') || localStorage.getItem('main_app_thumbnail_url') || '').trim();
          var elImg = document.getElementById('og-img');
          if (globalThumb && elImg) {
            elImg.setAttribute('content', globalThumb);
          }

          var params = new URLSearchParams(window.location.search);
          var templeId = params.get('temple') || params.get('templeId');
          if (!templeId) return;

          var raw = localStorage.getItem('temple_system_temples_json') || localStorage.getItem('savedTemples');
          if (raw) {
            var temples = JSON.parse(raw);
            if (Array.isArray(temples)) {
              var match = temples.find(function(t) { return t.id === templeId; });
              if (match) {
                var title = match.name + ' - ପୂଜା ଓ ଜଳାଭିଷେକ ବୁକିଂ';

                var img = match.thumbnailUrl || match.imageUrl || match.image || '';

                document.title = title;

                var elTitle = document.getElementById('og-title');
                if (elTitle) elTitle.setAttribute('content', title);

                var elDesc = document.getElementById('og-desc');
                if (elDesc) elDesc.setAttribute('content', desc);

                if (img && elImg) {
                  elImg.setAttribute('content', img);

              }
            }
          }
        } catch(e) {}
