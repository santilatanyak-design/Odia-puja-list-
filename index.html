    <!-- Dynamic Manifest Linking (Admin vs Public) and Global Prompt Capture -->
    <script>
      (function() {
        try {
          var pathname = (window.location.pathname || '/').toLowerCase();
          var searchParams = new URLSearchParams(window.location.search || '');
          var isAdminRoute = pathname === '/admin' || pathname.startsWith('/admin/') || searchParams.get('pwa') === 'admin' || searchParams.get('view') === 'admin';

          // Capture beforeinstallprompt globally
          window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            window.__PWA_INSTALL_PROMPT__ = e;
            window.__PWA_ADMIN_PROMPT__ = e;
          });

          // Register or update Service Worker to flush stale bundles
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js?v=2').then(function(reg) {
              if (reg && reg.update) {
                reg.update();
              }
            }).catch(function(err) {
              console.warn('SW registration warning:', err);
            });
          }

          // Set appropriate manifest link dynamically
          var manifestLink = document.createElement('link');
          manifestLink.rel = 'manifest';
          manifestLink.id = 'dynamic-pwa-manifest';
          manifestLink.href = isAdminRoute ? '/admin-manifest.json' : '/manifest.json';
          document.head.appendChild(manifestLink);
        } catch(err) {
          console.error('PWA bootstrap error:', err);
        }
      })();
    </script>

    <!-- Synchronous Immediate Pre-Render OG Tag Injector from Local Storage / URL / posts.json -->
    <script>
      (function() {
        var DEFAULT_BRAND_LOGO = 'https://www.bhaktianandaodiatvofficial.blog/brand-banner.svg';
        
        function setOrCreateMeta(attrName, attrValue, contentValue) {
          if (!contentValue) return;
          var els = document.querySelectorAll('meta[' + attrName + '="' + attrValue + '"]');
          if (els.length > 1) {
            for (var i = 1; i < els.length; i++) els[i].remove();
          }
          var el = document.querySelector('meta[' + attrName + '="' + attrValue + '"]');
          if (!el) {
            el = document.createElement('meta');
            el.setAttribute(attrName, attrValue);
            document.head.appendChild(el);
          }
          el.setAttribute('content', contentValue);
        }

        function resolveUrl(url) {
          if (!url || typeof url !== 'string' || !url.trim()) {
            return DEFAULT_BRAND_LOGO;
          }
          var clean = url.trim();
          if (clean.indexOf('http://') === 0 || clean.indexOf('https://') === 0 || clean.indexOf('data:') === 0) return clean;
          return window.location.origin + (clean.indexOf('/') === 0 ? '' : '/') + clean;
        }

        try {
          var pathname = window.location.pathname || '';
          var params = new URLSearchParams(window.location.search || '');
          
          var targetStoryId = '';
          var parts = pathname.split('/').filter(Boolean);
          if (parts[0] === 'story' || parts[0] === 'blog' || parts[0] === 'stories') {
            targetStoryId = parts[1] || '';
          } else {
            targetStoryId = params.get('storyId') || params.get('story') || '';
          }

          var customImg = params.get('og_image') || params.get('img') || params.get('image');
          var customTitle = params.get('og_title') || params.get('title');
          var customDesc = params.get('og_desc') || params.get('desc');

          // Check if localStorage has cached story data
          if (targetStoryId) {
            try {
              var rawV3 = localStorage.getItem('odia_spiritual_stories_v3');
              var rawStories = localStorage.getItem('odisha_spiritual_stories');
              var listV3 = rawV3 ? JSON.parse(rawV3) : [];
              var listBase = rawStories ? JSON.parse(rawStories) : [];
              var merged = (Array.isArray(listV3) ? listV3 : []).concat(Array.isArray(listBase) ? listBase : []);
              var match = merged.find(function(s) { return s && (s.id === targetStoryId || s.id === decodeURIComponent(targetStoryId)); });
              if (match) {
                if (!customTitle && match.title) customTitle = '📖 ' + match.title + ' | Bhakti Ananda Odia TV';
                if (!customDesc && (match.summary || match.content)) customDesc = (match.summary || match.content).slice(0, 157);
                if (!customImg && match.imageUrl) customImg = match.imageUrl;
              }
            } catch(e) {}
          }

          var finalImg = resolveUrl(customImg);

          if (customTitle) {
            document.title = customTitle;
            setOrCreateMeta('property', 'og:title', customTitle);
            setOrCreateMeta('name', 'twitter:title', customTitle);
          }
          if (customDesc) {
            setOrCreateMeta('name', 'description', customDesc);
            setOrCreateMeta('property', 'og:description', customDesc);
            setOrCreateMeta('name', 'twitter:description', customDesc);
          }

          // Force inject valid absolute og:image tags synchronously
          setOrCreateMeta('property', 'og:image', finalImg);
          setOrCreateMeta('property', 'og:image:secure_url', finalImg);
          setOrCreateMeta('property', 'og:image:url', finalImg);
          setOrCreateMeta('property', 'og:image:type', 'image/jpeg');
          setOrCreateMeta('property', 'og:image:width', '1200');
          setOrCreateMeta('property', 'og:image:height', '630');
          setOrCreateMeta('name', 'twitter:image', finalImg);
          setOrCreateMeta('name', 'twitter:image:src', finalImg);
          setOrCreateMeta('name', 'image', finalImg);
          setOrCreateMeta('itemprop', 'image', finalImg);
          setOrCreateMeta('name', 'twitter:card', 'summary_large_image');
        } catch(err) {
          // Fallback to default brand logo
          setOrCreateMeta('property', 'og:image', DEFAULT_BRAND_LOGO);
        }
      })();
    </script>

    <!-- Early Essential Polyfills for Legacy Mobile WebViews & Old Browsers -->
    <script>
      (function() {
        // String.prototype.replaceAll polyfill
        if (!String.prototype.replaceAll) {
          String.prototype.replaceAll = function(str, newStr) {
            if (Object.prototype.toString.call(str).toLowerCase() === '[object regexp]') {
              return this.replace(str, newStr);
            }
            return this.replace(new RegExp(str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), newStr);
          };
        }

        // Array.prototype.includes polyfill
        if (!Array.prototype.includes) {
          Array.prototype.includes = function(searchElement, fromIndex) {
            if (this == null) throw new TypeError('"this" is null or not defined');
            var o = Object(this);
            var len = o.length >>> 0;
            if (len === 0) return false;
            var n = fromIndex | 0;
            var k = Math.max(n >= 0 ? n : len - Math.abs(n), 0);
            while (k < len) {
              if (o[k] === searchElement || (typeof o[k] === 'number' && typeof searchElement === 'number' && isNaN(o[k]) && isNaN(searchElement))) {
                return true;
              }
              k++;
            }
            return false;
          };
        }

        // Object.assign polyfill
        if (typeof Object.assign !== 'function') {
          Object.assign = function(target) {
            if (target === null || target === undefined) {
              throw new TypeError('Cannot convert undefined or null to object');
            }
            var to = Object(target);
            for (var index = 1; index < arguments.length; index++) {
              var nextSource = arguments[index];
              if (nextSource !== null && nextSource !== undefined) {
                for (var nextKey in nextSource) {
                  if (Object.prototype.hasOwnProperty.call(nextSource, nextKey)) {
                    to[nextKey] = nextSource[nextKey];
                  }
                }
              }
            }
            return to;
          };
        }
      })();
    </script>

    <!-- 3-Second Auto-Reload Failsafe against White Screens / Cached Script Crashes -->
    <script>
      (function() {
        var hasReloaded = false;
        try {
          hasReloaded = sessionStorage.getItem('auto_reload_failsafe_done') === 'true';
        } catch (e) {}

        // Global Error Trap during startup
        var startupErrorOccurred = false;
        window.addEventListener('error', function(e) {
          startupErrorOccurred = true;
        });

        // 3-second check for blank/crashed page
        setTimeout(function() {
          try {
            var rootEl = document.getElementById('root');
            var isBlank = !rootEl || rootEl.children.length === 0;

            if ((isBlank || startupErrorOccurred) && !hasReloaded) {
              try {
                sessionStorage.setItem('auto_reload_failsafe_done', 'true');
              } catch (e) {}
              console.warn('Auto-Recovery Failsafe Triggered: Refreshing to clear stale cache and recover UI...');
              if (typeof window.location.reload === 'function') {
                window.location.reload(true);
              } else {
                window.location.href = window.location.href;
              }
            }
          } catch (err) {}
        }, 3000);
      })();
    </script>
